services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ironman
      POSTGRES_USER: ironman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironman -d ironman"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ironman:${POSTGRES_PASSWORD}@postgres:5432/ironman
      REDIS_URL: redis://redis:6379/0
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
    volumes:
      - .:/app
      - garmin_tokens:/app/.garmin_tokens
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      DATABASE_URL: postgresql://ironman:${POSTGRES_PASSWORD}@postgres:5432/ironman
      REDIS_URL: redis://redis:6379/0
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
    volumes:
      - .:/app
      - garmin_tokens:/app/.garmin_tokens
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - sync

volumes:
  postgres_data:
  garmin_tokens:
