services:
  - type: web
    name: ironman-intel-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ironman-intel-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false

databases:
  - name: ironman-intel-db
    plan: free
    databaseName: ironman
    user: ironman
